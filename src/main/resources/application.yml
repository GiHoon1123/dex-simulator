spring:
  application:
    name: dex-simulator

# Same port as the original NestJS server so that the same requests can be compared.
server:
  port: 3000

springdoc:
  swagger-ui:
    path: /api
  api-docs:
    path: /api-docs

# The original started block production and the transaction generator outside
# production. Tests turn this off (src/test/resources/application.properties).
dex:
  simulation:
    auto-start: true
